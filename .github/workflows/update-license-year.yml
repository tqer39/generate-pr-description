---
name: Update License Year

on:
  schedule:
    - cron: '0 0 1 1 *' # 毎年1月1日に実行
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  commit-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Git operations use the App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure authenticated Git
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: gh auth setup-git

      - uses: tqer39/update-license-year@ecb1743b65a4f7e6d2a7cbc7b96663a58db24304 # v1.0.0
        with:
          github-token: ${{ steps.app_token.outputs.token }}
